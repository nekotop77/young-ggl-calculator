<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인정보 처리방침</title>
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+KR:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #101124;
      font-family: 'Noto Sans KR', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      font-size: 14px;
      font-weight: 400;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #181a2a;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 0 0.5rem 32px 0.5rem;
      margin-top: 32px;
      font-size: 14px;
      font-weight: 400;
    }
    .header {
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 0.5rem;
      border-radius: 12px 12px 0 0;
      background: #181a2a;
    }
    .back-button {
      margin-left: -8px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .back-icon {
      width: 24px;
      height: 24px;
      display: block;
    }
    .title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-left: 8px;
      color: #fff;
    }
    .desc, .info, .footer, ul, li {
      color: #fff;
      font-size: 14px;
      font-weight: 400;
    }
    .desc {
      margin-bottom: 18px;
      margin-top: 8px;
    }
    ul {
      padding-left: 1.2em;
      margin-bottom: 18px;
    }
    ul li {
      margin-bottom: 2px;
    }
    .info {
      margin-bottom: 18px;
    }
    .footer {
    }
    @media (max-width: 600px) {
      .container { padding: 0 0.2rem 24px 0.2rem; }
      .header { height: 48px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-button" onclick="window.location.href='/setting'" aria-label="뒤로가기">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 19L8 12L15 5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="title">개인정보 처리방침</span>
    </div>
    <div style="padding:24px 0.5rem 0 0.5rem;">
      <div class="desc">
        본 앱은 어떠한 개인정보도 수집하거나 저장하지 않습니다.
      </div>
      <ul>
        <li>개인정보 수집: 없음</li>
        <li>서버 저장 또는 외부 전송: 없음</li>
        <li>제3자 제공: 없음</li>
        <li>광고 및 추적 도구 사용: 없음</li>
      </ul>
      <div class="info">
        제작자: leehyemin<br>
        이메일: cjsrmatkfkd@gmail.com<br>
        최종 업데이트일: 2025-06-28
      </div>
      <div class="footer">
        본 앱은 Google Play의 개인정보 보호 가이드라인을 준수합니다.
      </div>
    </div>
  </div>
</body>
</html>
